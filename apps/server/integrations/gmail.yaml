# Gmail - read, search, draft, label, archive, filters, signature and (with a
# person's approval) send and auto-reply.
# Its tools are code (src/integrations/modules/gmail.ts): email has to be built
# and decoded, which request templates can't do.
# Docs: https://developers.google.com/workspace/gmail/api/reference/rest
kind: code
id: gmail
name: Gmail
what: Read, search, draft, label and archive email, and manage filters and your signature; sending needs your approval
module: gmail
auth:
  type: oauth2
  authorize_url: https://accounts.google.com/o/oauth2/v2/auth
  token_url: https://oauth2.googleapis.com/token
  revoke_url: https://oauth2.googleapis.com/revoke
  # gmail.modify: reading, labels, drafts and sending - never permanent deletion.
  # gmail.settings.basic: filters, auto-reply and signatures - never forwarding or
  # delegates (gmail.settings.sharing). Both are registered on our Google client
  # (docs/shared-sign-ins.md): a scope added here must be added there first.
  scopes: [https://www.googleapis.com/auth/gmail.modify, https://www.googleapis.com/auth/gmail.settings.basic]
  # offline + consent: Google only returns a refresh token that way.
  params: { access_type: offline, prompt: consent }
  # Signs in with our Google client where the app has one: nothing to make.
  # The steps below are for an organization using its own Google project.
  shared: google
  client_url: https://console.cloud.google.com/auth/clients
  client_help: |
    1. In Google Cloud (console.cloud.google.com), create a project, or pick one.
    2. APIs & Services -> Library: enable the Gmail API.
    3. Google Auth Platform -> Branding: set up the consent screen (External is fine; your email as the contact).
    4. Audience: press Publish app. In Testing, Google ends the sign-in every 7 days.
    5. Clients -> Create client. Application type: Desktop app (not Web application - Google refuses this app's sign-in for those). Copy its client ID and secret here.
    6. Signing in will warn that Google hasn't verified the app - it's yours, so Continue.
test: { tool: gmail.list_messages, args: { query: in:inbox, max: 1 } }
