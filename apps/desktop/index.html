<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extremely Autonomous Agents</title>
    <!-- Starting up (or switching agency, which reloads): a spinner from the very
         first frame, until the app has its account and draws over it. -->
    <style>
      html, body { margin: 0; height: 100%; background: #141414; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-spin {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2.5px solid #2a2a2a; border-top-color: #8a8a8a;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spin { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><div class="boot-spin"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
