name: Release

# Builds the Windows installer and publishes it as a draft GitHub Release, which
# the app's auto-update reads once it's published - or, with "store", the
# Microsoft Store package, kept as this run's artifact to upload to Partner
# Center by hand (docs/packaging.md).
#
# Only ever run by hand (Actions > Release > Run workflow): never on a push, tag
# or schedule. Signing is metered, and a release is a decision. The job runs in
# the protected `release` environment - a person approves it before it starts,
# and the signing secrets live there and nowhere else.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: true
      target:
        description: What to build
        type: choice
        options: [installer, store]
        default: installer

permissions:
  contents: write # the draft release

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # also the Node the agency ships with

      - name: Set the version
        working-directory: apps/electron
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Stage the agency, the app and Node
        working-directory: apps/electron
        env:
          VITE_EAA_BACKEND_URL: ${{ vars.EAA_BACKEND_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          # Our Google client (apps/server/src/integrations/shared-clients.ts), so Gmail and Drive are just a sign-in.
          EAA_GOOGLE_CLIENT_ID: ${{ vars.EAA_GOOGLE_CLIENT_ID }}
          EAA_GOOGLE_CLIENT_SECRET: ${{ secrets.EAA_GOOGLE_CLIENT_SECRET }}
        run: node scripts/stage.cjs

      - name: Install the packager
        working-directory: apps/electron
        run: npm ci --no-audit --no-fund

      # Signed with Azure Trusted Signing once its details are in the `release`
      # environment; until then the installer is unsigned (Windows warns
      # "unknown publisher").
      - name: Build, sign when set up, publish a draft release
        if: inputs.target == 'installer'
        working-directory: apps/electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          SIGN=()
          if [ -n "$AZURE_CLIENT_ID" ]; then
            SIGN=(
              # The certificate's CN, exactly: electron-updater checks updates against it.
              "-c.win.azureSignOptions.publisherName=WORLD ASSET REGISTER PTY LTD"
              "-c.win.azureSignOptions.endpoint=${{ vars.AZURE_SIGNING_ENDPOINT }}"
              "-c.win.azureSignOptions.codeSigningAccountName=${{ vars.AZURE_SIGNING_ACCOUNT }}"
              "-c.win.azureSignOptions.certificateProfileName=${{ vars.AZURE_CERTIFICATE_PROFILE }}"
            )
          else
            echo "::warning::No Azure signing set up in the release environment: this build is unsigned."
          fi
          npx electron-builder --win --publish always "${SIGN[@]}"

      # The Store signs the package itself, so no signing here. Its identity comes
      # from Partner Center (Product identity), kept as variables in `release`.
      - name: Build the Microsoft Store package
        if: inputs.target == 'store'
        working-directory: apps/electron
        shell: bash
        run: |
          if [ -z "${{ vars.MS_STORE_IDENTITY_NAME }}" ] || [ -z "${{ vars.MS_STORE_PUBLISHER }}" ]; then
            echo "::error::Set MS_STORE_IDENTITY_NAME and MS_STORE_PUBLISHER in the release environment (Partner Center > Product identity)."
            exit 1
          fi
          # The runner's own Windows SDK packs it: electron-builder's bundled makeappx
          # can fail to start from its cache folder ("side-by-side configuration").
          KIT=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 | sort -V | tail -1)
          export ELECTRON_BUILDER_WINDOWS_KITS_PATH=$(cygpath -w "$KIT")
          npx electron-builder --win appx --publish never \
            "-c.appx.identityName=${{ vars.MS_STORE_IDENTITY_NAME }}" \
            "-c.appx.publisher=${{ vars.MS_STORE_PUBLISHER }}"

      - name: Keep the Store package
        if: inputs.target == 'store'
        uses: actions/upload-artifact@v4
        with:
          name: store-package-${{ inputs.version }}
          path: apps/electron/dist/*.appx
          if-no-files-found: error
